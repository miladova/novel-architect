# Illustration program for The Long Siege — one plate per chapter.
# Shared style anchor is prepended to every generation prompt; character
# descriptors are repeated verbatim for cross-image consistency.
# All plates: landscape 1376x768, no text/letters/watermarks, 1480s setting.
style_anchor: >-
  Romantic academic 19th-century oil painting in the manner of historical
  salon masters, luminous atmospheric light, rich muted palette of crimson,
  ultramarine blue, ochre gold, forest green and ivory, painterly visible
  brushwork, finely rendered late-15th-century Burgundian and French costume,
  emotionally composed figures, museum-quality detail. Historically accurate
  1480s world: Gothic plate harness, pikes, early bombards and hand-cannon,
  cotes, houppelandes, veils and hennins, Gothic stone architecture,
  half-timbered cloth towns. No text, no letters, no signatures, no
  watermarks, no Renaissance or later anachronisms. Wide landscape composition.
characters:
  jeanne: "a young ruling duchess in her early twenties, dark brown braided hair covered by a fine linen veil, grey eyes, pale skin, composed controlled expression, late-medieval noble gowns"
  thiebaut: "a lean weather-beaten soldier-duke in his late twenties, short sandy-brown hair, trimmed beard, calloused soldier's hands, gothic plate or dark soldier's garb"
palette_house: "Vauréal banners and surcoats in red and silver; Lorraine in blue and white"
