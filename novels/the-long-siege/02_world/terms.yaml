# Terms and proper-noun glossary — The Long Siege
places:
  Aubecourt: capital of Vauréal, on the river Ortelle; palace-citadel Haut-Tertre; cathedral of Saint-Cyr
  Haut-Tertre: ducal palace-citadel at Aubecourt
  Sainterre: largest cloth city, restive commune; printing press; Dolfin's fondaco
  Malemort: river port and grain/fish staple; Van Maerlant
  Grisay: iron forge city; Anselm's preaching ground
  Mont_dOr: frontier fortress facing France; lost Ch.17, retaken Ch.23
  Pont_dOrtelle: fortified bridge toll town
  Harchies: great forest; winter ambush Ch.15
  Roches_Noires: battlefield where Hugues died, March 1484
  Nancy: capital of Lorraine
  Heurtois: prince-bishopric; peace conference Ch.24
  Brive: loyalist county of Marshal Enguerrand
  Hautperthuis: traitor lordship of Gui
  Erquelines: imperial-leaning county of Othon
  Sombernon: Claire's dower land
people:
  Jeanne: Jeanne de Vauréal, duchess and protagonist, 22 at opening
  Thiebaut: Duke of Lorraine, 27, former ward at Aubecourt
  Hugues: late Duke of Vauréal, Jeanne's father, killed Roches-Noires
  Foulques: chancellor, 55, keeper of the rupture document
  Oriabel: Dame Oriabel, widowed cousin, household chief
  Lisette: Jeanne's maid, intelligence network
  Brive: Enguerrand de Brive, marshal, 63
  Rostaing: hardline cavalry captain, 28
  Gui: Gui de Hautperthuis, traitor lord, 45
  Othon: Count d'Erquelines, imperial waverer
  Coppens: Maitre Coppens, Sainterre guild dean
  de_Key: Willem de Key, weaver demagogue
  Anselm: Brother Anselm, radical preacher
  Van_Maerlant: Malemort port boss
  Dolfin: Zaccaria Dolfin, Venetian banker
  Jean: Jean the Bastard of Lorraine, Thiébaut's half-brother, 32
  Viray: Abbé de Viray, Lorraine chancellor
  Claire: Claire de Sombernon, widow, Thiébaut's former mistress, 27
  Perrin: Thiébaut's page-squire, 14
  Gracay: Sire de Gracay, French royal lieutenant
  Marcenay: French free-company captain, cruel
  Zollern: Herr von Zollern, imperial envoy
  Anne: Anne de France, Madame la Regente, offstage
money:
  ecu: gold ecu au soleil
  gros: silver gros gros coin
  livre: money of account
  mark: weight for silver
terms:
  charter: confirmed city self-rule document
  fondaco: foreign merchant trading house
  ordinance_company: duke's permanent paid troops
  gendarmes: French heavy cavalry
  francs_archers: French militia infantry
  bombard: heavy siege gun
  arquebus: early hand firearm
  homage: vassal oath to a lord
  attainder: legal extinction of a traitor's bloodline and lands
