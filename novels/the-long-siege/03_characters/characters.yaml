characters:
  - id: "jeanne"
    name: "Jeanne of Vauréal"
    role: "protagonist; ruling Duchess of Vauréal in her own right"
    pov: "anchor close third for the whole novel"
    arc: "From isolated, ledger-defended heir to a sovereign who rules through charters, credit, and chosen trust; ends as mother of an heiress and keeper of a peacetime order."
  - id: "thiebaut"
    name: "Thiébaut, Duke of Lorraine"
    role: "co-protagonist; childhood ward, forced husband, field commander"
    pov: "anchor chapters 4 and 15; split scenes in 5, 21, 23"
    arc: "From self-exiled instrument of war to an honest partner; the seven-year rupture is revealed as protective sacrifice; left shoulder permanently stiff."
  - id: "foulques"
    name: "Maître Foulques"
    role: "chancellor; keeper of the green case"
    arc: "Hugues's reluctant clerk who preserved the evidence of his own coercion; confesses in Ch.18, refused resignation, performs penance through the orphan school and a sealed archive account."
  - id: "lisette"
    name: "Lisette"
    role: "Jeanne's maid and spymaster"
    arc: "Survives the branding threat that helped force Thiébaut's renunciation; builds the fifth-column map and the household intelligence network."
  - id: "brive"
    name: "Brive"
    role: "old marshal; Jeanne's godfather by the christening"
    arc: "The army's institutional memory; carries the professional-soldier view of every campaign."
  - id: "jean"
    name: "Jean the Bastard"
    role: "Thiébaut's half-brother and cavalry captain"
    arc: "Takes the pike wound at Sarrebourg; comic and loyal backbone of the field army."
  - id: "coppens"
    name: "Coppens"
    role: "Sainterre guildmaster and alderman"
    arc: "From cautious moderate to the political heart of the charter cities; present at the christening with the first rebuilt cloth."
  - id: "dolfin"
    name: "Dolfin"
    role: "Venetian banker"
    arc: "Holds the war debt at declining rates as Jeanne's credit strengthens; returns to Venice after peace, leaving a factor."
  - id: "rostaing"
    name: "Rostaing"
    role: "brilliant cavalry officer"
    arc: "Publicly broken from captain to man-at-arms for the Argnon burning; redeems himself at Sainterre by killing Marcenay; ends commanding Mont d'Or."
  - id: "gracay"
    name: "Sire de Graçay"
    role: "French professional commander"
    arc: "Loses the Sainterre investment professionally; leads the French side at Heurtois and accepts the charter clauses."
  - id: "hautperthuis"
    name: "Lord Hautperthuis"
    role: "principal traitor; great vassal"
    arc: "Seizes Mont d'Or by treachery; tried in open printed peer court; attainted as lordship not bloodline; executed by sword February 1486; his posthumous letter names three French contacts."
  - id: "marcenay"
    name: "Captain de Marcenay"
    role: "French free-company commander"
    arc: "Responsible for Sainte-Florence and the Sainterre crypt; killed in the battery ditch by Rostaing."
  - id: "chastel"
    name: "Commandant Chastel"
    role: "French commandant of Mont d'Or"
    arc: "Professional soldier treated with honorable captivity and ransom after the fortress falls."
  - id: "valvert"
    name: "Valvert"
    role: "old frontier marshal"
    arc: "Killed when Mont d'Or is betrayed; reburied at Aubecourt with a memorial gate stone naming him."
  - id: "hugues"
    name: "Duke Hugues"
    role: "Jeanne's late father"
    arc: "Dead before the novel opens; his coercive rule and the convent-order threat are the buried engine of the rupture and Jeanne's fear of becoming him."
  - id: "claire"
    name: "Claire"
    role: "court friend; godmother to Aveline"
  - id: "oriabel"
    name: "Oriabel"
    role: "joint household officer with Claire"
  - id: "perrin"
    name: "Perrin"
    role: "page, then household man-at-arms"
    arc: "Smells the poisoned wine meant for Thiébaut at Mont d'Or; earns spurs and his first high-table place."
  - id: "verhoeven"
    name: "Verhoeven"
    role: "master printer"
    arc: "Prints proclamations, the siege news sheet, and the peace edition; ends with three licensed competitors."
  - id: "van_brock"
    name: "Van Brock"
    role: "Grisay master gunner"
    arc: "Provides the firing tables Jeanne uses on the Mont d'Or battery and the new cavalry drill afterward."
  - id: "sister_margriet"
    name: "Sister Margriet"
    role: "court physician-nun"
    arc: "Manages the pregnancy, the convalescences, and the siege hospitals."
  - id: "bride"
    name: "Bride"
    role: "veteran officer"
    arc: "Convinced by the Rostaing verdict; returns to the field against medical advice."
  - id: "anne_de_france"
    name: "Anne de France, Regent of France"
    role: "off-stage architect of the peace push"
    arc: "Her letter and interests make the Treaty of Heurtois possible."
  - id: "aveline"
    name: "Aveline of Vauréal"
    role: "Jeanne and Thiébaut's daughter and heir"
    arc: "Born 28 April 1486, named for Jeanne's mother; female-line succession secured with no wardships."
